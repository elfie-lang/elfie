name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Build, check, and test
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Check definitions bind with no problems
        run: ./target/debug/elfie check
      - name: Check definitions are formatted
        run: ./target/debug/elfie format --check
      - name: Test
        run: cargo test --workspace --locked
      - name: Test release versioning
        run: scripts/release/test-version.sh
      # Last so that a stale unit does not hide the results of the steps above.
      - name: Check every unit is up to date
        run: ./target/debug/elfie check --strict

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Reports lints as annotations without failing: crates/ is generated from def/, so lints
      # are fixed by recompiling units rather than by editing the output.
      - run: cargo clippy --workspace --all-targets --locked

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - name: Check syntax
        run: node --check extension.js
      - name: Package
        run: npx vsce package --allow-missing-repository
