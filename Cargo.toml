[workspace]
members = ["crates/elfie-core", "crates/elfie-lsp", "crates/elfie-mcp", "crates/elfie-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
elfie-core = { path = "crates/elfie-core" }
serde_json = "1"
sha2 = "0.11"
unicode-ident = "1.0.24"
tokio = { version = "1", features = ["full"] }
tower-lsp = "0.20"
rmcp = { version = "3.4", features = ["server", "transport-io", "macros"] }
clap = "4"
